<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>πOS</title>
  <link rel="icon" type="image/svg+xml" href="api/logo.svg">
  <meta http-equiv="refresh" content="0; url=demo/">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000; color:#fff;
      font-family:'Segoe UI', system-ui, sans-serif;
      display:flex; align-items:center; justify-content:center;
      height:100vh; flex-direction:column; gap:16px;
    }
    img { border-radius:16px; animation:pulse 1.5s infinite; }
    p { color:#555; font-size:13px; }
    a { color:#0078D4; text-decoration:none; }
    a:hover { text-decoration:underline; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  </style>
</head>
<body>
  <img src="api/logo.svg" width="72" height="72" alt="πOS">
  <!-- <p>正在導向... <a href="demo/">點此進入 πOS</a></p> -->
   <p>載入中</p>
</body>
</html>
